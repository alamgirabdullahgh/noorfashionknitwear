<!DOCTYPE html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Noor Fashion</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0c1222"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="app-version" content="__VERSION__">
<style>
:root{--bg:#f5f2ea;--c:#fff;--t:#161a24;--m:#7b8092;--g:#a9822f;--g2:#d9b560;--ok:#16895a;--no:#c8414f;--l:#ebe6da;--sh:0 1px 2px #0c122410,0 10px 26px -10px #0c122430}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#080b14;--c:#121827;--t:#f2ede1;--m:#8c93a8;--g:#d9b560;--g2:#f0d58e;--l:#1f2638;--sh:0 10px 30px -12px #000c}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--t);font:15px/1.55 'Noto Sans Bengali','Hind Siliguri',system-ui,sans-serif;font-variant-numeric:tabular-nums;overscroll-behavior:none}
header{background:radial-gradient(120% 90% at 100% 0,#2a3f78 0,transparent 55%),linear-gradient(160deg,#16234a,#0a0f1e);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 16px) 20px 58px;border-radius:0 0 30px 30px}
.tp{display:flex;justify-content:space-between;align-items:center}#co{font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--g2)}
#gs{width:38px;height:38px;border-radius:50%;border:1px solid #ffffff26;background:#ffffff12;color:#fff;display:grid;place-items:center;padding:0}
h1{margin:14px 0 0;font-size:29px;line-height:1.2;font-weight:700;letter-spacing:-.01em}header small{opacity:.6;font-size:13px}
main{padding:0 16px 120px;max-width:640px;margin:-34px auto 0;position:relative}
.an>*{animation:up .32s both}@keyframes up{from{opacity:0;transform:translateY(10px)}}
nav{position:fixed;left:14px;right:14px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:520px;margin:auto;display:flex;gap:2px;background:var(--c);border:1px solid var(--l);border-radius:26px;padding:6px;box-shadow:0 12px 40px -8px #0c122459;z-index:5}
nav button{flex:1;border:0;background:none;color:var(--m);font:600 10.5px 'Noto Sans Bengali','Hind Siliguri',sans-serif;padding:7px 0 5px;border-radius:20px;display:flex;flex-direction:column;align-items:center;gap:3px;transition:.2s}
nav svg{width:22px;height:22px}nav .on{color:var(--g);background:#b8923a1f}
svg{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.card{background:var(--c);border:1px solid var(--l);border-radius:22px;padding:16px;margin:0 0 12px;box-shadow:var(--sh)}
.hero{position:relative;overflow:hidden;color:#fff;border-radius:26px;padding:20px 20px 18px;margin:0 0 12px;background:linear-gradient(145deg,#1d2d58,#0a0f1e);box-shadow:0 18px 40px -16px #0c1222cc;border:1px solid #ffffff14}
.hero:after{content:'';position:absolute;right:-50px;top:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(#d9b56040,transparent 70%)}
.hero span{font-size:12.5px;opacity:.7}.hero b{display:block;font-size:36px;line-height:1.25;font-weight:700;background:linear-gradient(120deg,#f6e3a8,#d9b560);-webkit-background-clip:text;background-clip:text;color:transparent}
.ch{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.ch i{font-style:normal;font-size:12.5px;padding:5px 11px;border-radius:20px;background:#ffffff14}.ch .p{color:#6fe0ae}.ch .q{color:#ff9aa4}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.k{background:var(--c);border:1px solid var(--l);border-radius:20px;padding:14px;box-shadow:var(--sh)}
.k svg{width:34px;height:34px;padding:8px;border-radius:12px;background:#b8923a1f;color:var(--g);margin-bottom:8px}.k b{display:block;font-size:21px;line-height:1.2}.k span{font-size:12px;color:var(--m)}
h3{margin:2px 0 10px;font-size:12.5px;letter-spacing:.06em;color:var(--m);font-weight:600}
input,select,textarea{width:100%;padding:12px 14px;border:1px solid var(--l);border-radius:14px;background:var(--bg);color:var(--t);font:inherit;margin:4px 0;outline:0;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--g);box-shadow:0 0 0 3px #b8923a26}
.r{display:flex;gap:8px;align-items:center}.r>*{flex:1}
.btn{display:inline-block;border:0;border-radius:14px;padding:12px 20px;background:linear-gradient(135deg,#ecd081,#b8923a);color:#1a1405;font:700 14px 'Noto Sans Bengali','Hind Siliguri',sans-serif;text-decoration:none;text-align:center;box-shadow:0 8px 18px -8px #b8923acc;transition:.15s}.btn:active{transform:scale(.96)}
.btn.wa{background:linear-gradient(135deg,#2bc16e,#14914f);color:#fff;box-shadow:0 8px 18px -8px #14914f99}.btn.s{padding:8px 12px;font-size:12.5px;flex:none;border-radius:12px}
.btn.x{background:transparent;border:1px solid var(--l);color:var(--t);box-shadow:none}.btn.d{background:var(--no);color:#fff;box-shadow:none}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 0;border-bottom:1px solid var(--l)}.row:last-child{border:0}.m{color:var(--m);font-size:12.5px}.p{color:var(--ok);font-weight:700}.q{color:var(--no);font-weight:700}
.wk{display:flex;gap:12px;align-items:center}.wi{flex:1;min-width:0}.av{width:44px;height:44px;border-radius:15px;flex:none;display:grid;place-items:center;font-weight:700;font-size:18px;color:var(--g2);background:linear-gradient(145deg,#1d2d58,#0a0f1e)}
.al{background:#c8414f18;color:var(--no);border-radius:14px;padding:10px 14px;margin-bottom:12px;font-size:13px;font-weight:600}
main>p.m{text-align:center;padding:30px 12px}
.sb{display:flex;gap:8px;margin-top:10px}.sb input{margin:0}.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}th,td{padding:10px 8px;border-bottom:1px solid var(--l);text-align:right}th:first-child,td:first-child{text-align:left}th{color:var(--m);font-weight:600;font-size:11.5px}tfoot td{font-weight:700;color:var(--g);border:0}
@media print{nav,header,.sb,[data-a]{display:none!important}body{background:#fff}main{margin:0}}
</style></head><body>
<header><div class="tp"><span id="co"></span><button id="gs" aria-label="সেটিংস"><svg viewBox="0 0 24 24" width="19" height="19"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0M14 4v4M8 10v4M16 16v4"/></svg></button></div><h1 id="tt"></h1><small id="dd"></small></header>
<main id="v" class="an"></main>
<nav id="nv"></nav>
<script>
const K='nf1',Z=()=>new Date().toISOString().slice(0,10);
let D={w:[],a:{},t:[],i:[],m:[],s:{n:'Noor Fashion',i:'08:00',o:'17:00',d:26,x:2,cc:'88',ph:''}},T='h',DT=Z(),MO=Z().slice(0,7),ED=null,AR=null;
try{D=Object.assign(D,JSON.parse(localStorage.getItem(K)))}catch(e){}
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),S=()=>{try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}},$=s=>document.querySelector(s),id=()=>Math.random().toString(36).slice(2,9),
N=(n,d=0)=>'৳'+(+n||0).toLocaleString('bn-BD',{maximumFractionDigits:d}),H=(n)=>(+n||0).toLocaleString('bn-BD',{maximumFractionDigits:1}),
mn=t=>{const p=(t||'0:0').split(':');return p[0]*60+ +p[1]},ph=v=>{v=(v||'').replace(/\D/g,'');return v[0]=='0'?D.s.cc+v.slice(1):v},
sh=()=>Math.max(1,(mn(D.s.o)-mn(D.s.i))/60);
function day(r){if(!r||r.x)return{p:0,ot:0,w:0};if(!r.i||!r.o)return{p:0,ot:0,w:0};const w=Math.max(0,mn(r.o)-mn(r.i));return{p:1,w:w/60,ot:Math.max(0,mn(r.o)-mn(D.s.o))/60}}
function pay(w,ym){let p=0,ab=0,ot=0;for(const d in D.a)if(d.startsWith(ym)){const r=D.a[d][w.id];if(!r)continue;if(r.x)ab++;else{const q=day(r);p+=q.p;ot+=q.ot}}
const dl=w.s/D.s.d,o=ot*dl/sh()*D.s.x,de=ab*dl;return{p,ab,ot,o,de,tot:Math.round(w.s-de+o)}}
function send(t,p){return `<div class="sb"><input type="tel" data-ph placeholder="WhatsApp নম্বর (01XXXXXXXXX)" value="${p||D.s.ph||''}"><a class="btn wa" target="_blank" rel="noopener" data-t="${encodeURIComponent(t)}" href="#">পাঠান</a></div>`}
const tx=d=>D.t.filter(x=>x.d==d),sum=(a,t)=>a.filter(x=>x.t==t).reduce((s,x)=>s+x.a,0);
const V={
h(){const a=D.a[Z()]||{},pr=D.w.filter(w=>day(a[w.id]).p).length,t=tx(Z()),mt=D.t.filter(x=>x.d.startsWith(Z().slice(0,7))),pm=D.w.reduce((s,w)=>s+pay(w,Z().slice(0,7)).tot,0),low=D.i.filter(x=>x.q<=x.m),mi=sum(mt,'i'),mo=sum(mt,'o');
return `<div class="hero"><span>এই মাসের নিট লাভ</span><b>${N(mi-mo)}</b><div class="ch"><i class="p">↑ আয় ${N(mi)}</i><i class="q">↓ ব্যয় ${N(mo)}</i></div></div>${low.length?`<div class="al">⚠ ${H(low.length)} টি মালের মজুদ কম: ${low.slice(0,3).map(x=>E(x.n)).join(', ')}</div>`:''}
<div class="g"><div class="k">${ic('users')}<b>${H(D.w.length)}</b><span>মোট কর্মী</span></div><div class="k">${ic('clock')}<b>${H(pr)}<small class="m"> / ${H(D.w.length)}</small></b><span>আজ উপস্থিত</span></div><div class="k">${ic('up')}<b class="p">${N(sum(t,'i'))}</b><span>আজকের আয়</span></div><div class="k">${ic('dn')}<b class="q">${N(sum(t,'o'))}</b><span>আজকের ব্যয়</span></div></div>
<div class="card"><h3>এই মাসের সারসংক্ষেপ</h3><div class="row"><span>বেতন (আনুমানিক)</span><b>${N(pm)}</b></div><div class="row"><span>কম মজুদ</span><b class="${low.length?'q':''}">${H(low.length)} টি</b></div></div>`},
w(){const e=D.w.find(x=>x.id==ED)||{};return `<div class="card"><h3>${ED?'কর্মী সম্পাদনা':'নতুন কর্মী'}</h3><input id="wn" placeholder="নাম" value="${E(e.n)}"><input id="wp" type="tel" placeholder="ফোন নম্বর" value="${E(e.p)}"><input id="wa" placeholder="ঠিকানা" value="${E(e.a)}"><div class="r"><input id="wd" placeholder="পদবী" value="${E(e.d)}"><input id="ws" type="number" placeholder="মাসিক বেতন" value="${e.s||''}"></div><button class="btn" data-a="sw">${ED?'হালনাগাদ':'যুক্ত করুন'}</button> ${ED?'<button class="btn x" data-a="cw">বাতিল</button>':''}</div>`+
D.w.map(w=>`<div class="card"><div class="wk"><div class="av">${E(w.n).slice(0,1)}</div><div class="wi"><b>${E(w.n)}</b> <span class="m">${E(w.d)}</span><div class="m">${E(w.p)} · ${E(w.a)}</div></div><b>${N(w.s)}</b></div><div class="r" style="margin-top:10px"><button class="btn s x" data-a="ew" data-i="${w.id}">সম্পাদনা</button><button class="btn s x" data-a="dw" data-i="${w.id}">মুছুন</button></div></div>`).join('')||'<p class="m">কোনো কর্মী নেই। উপরে প্রথম কর্মী যুক্ত করুন।</p>'},
a(){const a=D.a[DT]||{};let t=`*${D.s.n}* হাজিরা ${DT}\n`;const rows=D.w.map(w=>{const r=a[w.id]||{},q=day(r);t+=`${w.n}: ${r.x?'অনুপস্থিত':(r.i||'-')+'–'+(r.o||'-')+' OT '+H(q.ot)+'ঘ'}\n`;
return `<div class="card"><div class="row" style="border:0"><b>${E(w.n)}</b><span class="m">${r.x?'অনুপস্থিত':q.p?'কাজ '+H(q.w)+'ঘ · OT '+H(q.ot)+'ঘ':''}</span></div><div class="r"><input type="time" data-c="i" data-w="${w.id}" value="${r.i||''}"><input type="time" data-c="o" data-w="${w.id}" value="${r.o||''}"><button class="btn s ${r.x?'d':'x'}" data-a="ab" data-i="${w.id}">অনুপস্থিত</button></div></div>`}).join('');
return `<div class="card"><input type="date" id="dt" value="${DT}"><button class="btn s x" data-a="fill">সবার ডিউটির সময় বসান (${D.s.i}–${D.s.o})</button></div>${rows||'<p class="m">আগে কর্মী যুক্ত করুন।</p>'}<div class="card">${send(t)}</div>`},
f(){const l=tx(DT);let t=`*${D.s.n}* হিসাব ${DT}\n`+l.map(x=>`${x.t=='i'?'আয়':'ব্যয়'} ${x.c}: ${N(x.a)}`).join('\n')+`\nআয় ${N(sum(l,'i'))} · ব্যয় ${N(sum(l,'o'))} · লাভ ${N(sum(l,'i')-sum(l,'o'))}`;
return `<div class="card"><input type="date" id="dt" value="${DT}"><div class="r"><select id="ft"><option value="i">আয়</option><option value="o">ব্যয়</option></select><input id="fa" type="number" placeholder="টাকা"></div><input id="fc" list="cl" placeholder="খাত (বিক্রি, কাঁচামাল, ভাড়া…)"><datalist id="cl"><option>বিক্রি<option>কাঁচামাল<option>বেতন<option>ভাড়া<option>বিদ্যুৎ<option>পরিবহন<option>অন্যান্য</datalist><input id="fn" placeholder="নোট"><button class="btn" data-a="sf">সংরক্ষণ</button></div>
<div class="card"><h3>${DT}</h3>${l.map(x=>`<div class="row"><span>${E(x.c)} <span class="m">${E(x.n)}</span></span><span><b class="${x.t=='i'?'p':'q'}">${x.t=='i'?'+':'−'}${N(x.a)}</b> <button class="btn s x" data-a="df" data-i="${x.id}">×</button></span></div>`).join('')||'<p class="m">আজ কোনো এন্ট্রি নেই।</p>'}<div class="row"><b>লাভ</b><b>${N(sum(l,'i')-sum(l,'o'))}</b></div>${send(t)}</div>`},
s(){let t=`*${D.s.n}* মজুদ\n`+D.i.map(x=>`${x.n}: ${H(x.q)} ${x.u}`).join('\n');
return `<div class="card"><h3>নতুন মালামাল</h3><input id="in" placeholder="মালের নাম"><div class="r"><input id="iu" placeholder="একক (পিস/কেজি)"><input id="iq" type="number" placeholder="শুরুর পরিমাণ"><input id="im" type="number" placeholder="সর্বনিম্ন"></div><button class="btn" data-a="si">যুক্ত করুন</button></div>`+
D.i.map(x=>`<div class="card"><div class="row" style="border:0"><b>${E(x.n)}</b><b class="${x.q<=x.m?'q':'p'}">${H(x.q)} ${E(x.u)}</b></div><div class="r"><input type="number" id="q${x.id}" placeholder="পরিমাণ"><button class="btn s" data-a="mv" data-i="${x.id}" data-s="1">＋ জমা</button><button class="btn s x" data-a="mv" data-i="${x.id}" data-s="-1">− খরচ</button><button class="btn s x" data-a="di" data-i="${x.id}">×</button></div></div>`).join('')+
`<div class="card"><h3>সাম্প্রতিক লেনদেন</h3>${D.m.slice(-10).reverse().map(l=>{const x=D.i.find(i=>i.id==l.i);return x?`<div class="row"><span>${E(x.n)} <span class="m">${l.d}</span></span><b class="${l.q>0?'p':'q'}">${l.q>0?'+':'−'}${H(Math.abs(l.q))} ${E(x.u)}</b></div>`:''}).join('')||'<p class="m">এখনো কোনো জমা/খরচ নেই।</p>'}</div><div class="card">${send(t)}</div>`},
m(){let t=`*${D.s.n}* মাসিক শিট ${MO}\n`,gt=0,go=0;const rows=D.w.map(w=>{const q=pay(w,MO);gt+=q.tot;go+=q.ot;t+=`${w.n}: ${H(q.p)} দিন, OT ${H(q.ot)}ঘ, মোট ${N(q.tot)}\n`;
return `<tr><td>${E(w.n)}</td><td>${H(q.p)}</td><td>${H(q.ot)}</td><td>${N(w.s)}</td><td>${N(q.o)}</td><td>${N(q.de)}</td><td>${N(q.tot)}</td><td><a class="btn wa s" target="_blank" rel="noopener" data-p="${w.p||''}" data-t="${encodeURIComponent(`*${D.s.n}* ${MO}\n${w.n}\nউপস্থিত ${H(q.p)} দিন\nওভারটাইম ${H(q.ot)} ঘণ্টা (${N(q.o)})\nকর্তন ${N(q.de)}\nমোট বেতন ${N(q.tot)}`)}" href="#">WA</a></td></tr>`}).join('');t+=`সর্বমোট: ${N(gt)}`;

g(){const s=D.s;return `<div class="card"><h3>অ্যাপ আপডেট</h3><p class="m">বর্তমান সংস্করণ: ${E(VER&&VER.indexOf('__')<0?VER:'ডেভেলপমেন্ট')}</p><div id="upr"></div><button class="btn" data-a="up">আপডেট আছে কিনা দেখুন</button></div><div class="card"><h3>সেটিংস</h3><input id="sn" value="${E(s.n)}" placeholder="প্রতিষ্ঠানের নাম"><div class="r"><input id="si1" type="time" value="${s.i}"><input id="so" type="time" value="${s.o}"></div><div class="r"><input id="sd" type="number" value="${s.d}" placeholder="মাসের কর্মদিবস"><input id="sx" type="number" step=".1" value="${s.x}" placeholder="OT গুণক"></div><input id="sc" value="${E(s.cc)}" placeholder="দেশের কোড (88)"><p class="m">OT = ডিউটি শেষের পর কাজের সময়। রেট = দৈনিক বেতন ÷ ডিউটি ঘণ্টা × গুণক।</p><button class="btn" data-a="ss">সংরক্ষণ</button></div><div class="card"><h3>ব্যাকআপ</h3><p class="m">ডেটা এই ব্রাউজারে থাকে। নিয়মিত নিচের লেখা কপি করে রাখুন; ফেরাতে পেস্ট করে চাপুন।</p><textarea id="bk" style="width:100%;height:90px;background:var(--bg);color:var(--t);border:1px solid var(--l);border-radius:12px">${JSON.stringify(D).replace(/</g,'\\u003c')}</textarea><button class="btn x" data-a="rs">রিস্টোর</button></div>`}};
