name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web files
        run: |
          V="$(date -u +%Y%m%d-%H%M)-${GITHUB_SHA::7}"
          mkdir www
          cp index.html sw.js manifest.webmanifest icon-192.png icon-512.png www/
          sed -i "s/__VERSION__/$V/g" www/index.html www/sw.js
          sed -i "s/__BUILD__/${GITHUB_RUN_NUMBER}/g" www/index.html
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"

      - name: Create Capacitor Android project
        run: |
          npm init -y >/dev/null
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.noorfashion.app",
            "appName": "Noor Fashion",
            "webDir": "www",
            "backgroundColor": "#0c1222",
            "android": { "allowMixedContent": false }
          }
          JSON
          npx cap add android
          npx cap sync android

      - name: Add native updater (AutoReply-style) and version code
        run: |
          D=android/app/src/main/java/com/noorfashion/app
          cp native/*.java $D/
          python3 - <<'PY'
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p).read()
          perm='<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/><uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>'
          rec='<receiver android:name=".UpdateReceiver" android:exported="false"/><receiver android:name=".AfterUpdateReceiver" android:exported="true"><intent-filter><action android:name="android.intent.action.MY_PACKAGE_REPLACED"/></intent-filter></receiver>'
          assert '<application' in s and '</application>' in s
          s=s.replace('<application',perm+'<application',1).replace('</application>',rec+'</application>',1)
          open(p,'w').write(s)
          PY
          sed -i "s/versionCode 1/versionCode $GITHUB_RUN_NUMBER/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Branding (status bar colour, splash screen)
        run: |
          RES=android/app/src/main/res
          sed -i 's#<item name="windowNoTitle">true</item>#<item name="windowNoTitle">true</item><item name="android:statusBarColor">\#0C1222</item><item name="android:navigationBarColor">\#0C1222</item>#' $RES/values/styles.xml
          find $RES -name 'splash.png' -exec cp splash.png {} \;

      - name: Set app icon
        run: |
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp icon-192.png $RES/mipmap-$d/ic_launcher.png
            cp icon-192.png $RES/mipmap-$d/ic_launcher_round.png
          done

      - name: Use fixed signing key (so updates install over old versions)
        run: |
          mkdir -p ~/.android
          cp android-signing/debug.keystore ~/.android/debug.keystore

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleDebug --no-daemon > ../build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -E "error:|\.java:[0-9]+|What went wrong|Execution failed|symbol:" ../build.log | head -30 | while IFS= read -r l; do echo "::error::${l:0:300}"; done
          fi
          tail -3 ../build.log
          exit $code

      - name: Collect APK
        run: |
          mkdir out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/NoorFashion.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NoorFashion-apk
          path: out/NoorFashion.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" out/NoorFashion.apk \
            --title "Noor Fashion $TAG" \
            --notes "Android APK ($APP_VERSION). ফোনে ডাউনলোড করে ইনস্টল করুন।"
